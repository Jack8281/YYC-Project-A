<html lang="en">
<head>
  <meta charset="utf-8">

  <title>YYC Job Control â€“ Manager Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Embedded YYC Assistant styles -->
  <style>
/* YYC Job Control â€“ chatbot widget styles (standalone, all classes prefixed yyc-chat) */
.yyc-chat {
  --c-navy-900: #13233A;
  --c-navy-700: #2B3D57;
  --c-navy-subtle: #E8EDF4;
  --c-blue: #1B4F9C;
  --c-blue-hover: #153E7A;
  --c-blue-soft: #E3EDFB;
  --c-bg: #F4F5F7;
  --c-card: #FFFFFF;
  --c-text: #16202E;
  --c-muted: #4A5668;
  --c-light: #A9B6C8;
  --c-border: #E1E5EB;
  --c-amber: #D9822B;
  --c-red: #A1261B;
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  color: var(--c-text);
}
.yyc-chat *, .yyc-chat *::before, .yyc-chat *::after { box-sizing: border-box; }

/* Floating launcher button */
.yyc-chat__launcher {
  position: fixed; right: 24px; bottom: 24px; z-index: 1000;
  width: 56px; height: 56px; border: 0; border-radius: 50%;
  background: var(--c-blue); color: #fff; cursor: pointer;
  display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(19, 35, 58, .28);
  transition: background .15s, transform .15s;
}
.yyc-chat__launcher:hover { background: var(--c-blue-hover); transform: translateY(-1px); }
.yyc-chat__launcher:focus-visible { outline: 3px solid var(--c-blue-soft); outline-offset: 2px; }
.yyc-chat__launcher svg { width: 26px; height: 26px; }

/* Panel */
.yyc-chat__panel {
  position: fixed; right: 24px; bottom: 92px; z-index: 1000;
  width: 380px; max-width: calc(100vw - 32px);
  height: 560px; max-height: calc(100vh - 120px);
  display: none; flex-direction: column;
  background: var(--c-card); border: 1px solid var(--c-border); border-radius: 10px;
  box-shadow: 0 12px 40px rgba(19, 35, 58, .22); overflow: hidden;
}
.yyc-chat.is-open .yyc-chat__panel { display: flex; }

.yyc-chat__header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; background: var(--c-navy-900); color: #fff;
}
.yyc-chat__avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--c-navy-700); display: grid; place-items: center; flex: none;
}
.yyc-chat__avatar svg { width: 18px; height: 18px; }
.yyc-chat__title { font-weight: 600; font-size: 14px; line-height: 1.2; }
.yyc-chat__sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--c-light); }
.yyc-chat__close {
  margin-left: 0; border: 0; background: transparent; color: var(--c-light);
  font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 4px;
}
.yyc-chat__close:hover { color: #fff; background: var(--c-navy-700); }

/* Messages */
.yyc-chat__messages {
  flex: 1; overflow-y: auto; padding: 16px; background: var(--c-bg);
  display: flex; flex-direction: column; gap: 10px;
}
.yyc-chat__msg {
  max-width: 85%; padding: 9px 12px; border-radius: 10px;
  line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
}
.yyc-chat__msg--bot {
  align-self: flex-start; background: var(--c-card);
  border: 1px solid var(--c-border); border-bottom-left-radius: 3px;
}
.yyc-chat__msg--user {
  align-self: flex-end; background: var(--c-blue); color: #fff; border-bottom-right-radius: 3px;
}
.yyc-chat__msg code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--c-navy-subtle); padding: 1px 4px; border-radius: 3px; }
.yyc-chat__time { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--c-light); margin-top: 3px; }
.yyc-chat__msg--user .yyc-chat__time { color: #C9D6EE; }

/* Typing indicator */
.yyc-chat__typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.yyc-chat__typing span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--c-light);
  animation: yyc-chat-bounce 1.1s infinite ease-in-out;
}
.yyc-chat__typing span:nth-child(2) { animation-delay: .15s; }
.yyc-chat__typing span:nth-child(3) { animation-delay: .3s; }
@keyframes yyc-chat-bounce { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

/* Quick suggestions */
.yyc-chat__chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; background: var(--c-bg); }
.yyc-chat__chip {
  border: 1px solid var(--c-border); background: var(--c-card); color: var(--c-blue);
  border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer;
}
.yyc-chat__chip:hover { background: var(--c-blue-soft); border-color: var(--c-blue); }

/* Input */
.yyc-chat__form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--c-border); background: var(--c-card); }
.yyc-chat__input {
  flex: 1; border: 1px solid var(--c-border); border-radius: 6px; padding: 9px 11px;
  font: inherit; color: var(--c-text); background: #fff;
}
.yyc-chat__input:focus { outline: none; border-color: var(--c-blue); box-shadow: 0 0 0 3px var(--c-blue-soft); }
.yyc-chat__send {
  border: 0; border-radius: 6px; background: var(--c-blue); color: #fff;
  padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer;
}
.yyc-chat__send:hover { background: var(--c-blue-hover); }
.yyc-chat__send:disabled { background: var(--c-light); cursor: not-allowed; }
.yyc-chat__note { padding: 0 12px 10px; background: var(--c-card); font-size: 11px; color: var(--c-light); text-align: center; }

@media (max-width: 480px) {
  .yyc-chat__panel { right: 8px; bottom: 80px; width: calc(100vw - 16px); }
  .yyc-chat__launcher { right: 16px; bottom: 16px; }
}

/* Formatted bot replies */
.yyc-chat__body p { margin: 0; }
.yyc-chat__body p + p, .yyc-chat__body p + ul, .yyc-chat__body ul + p { margin-top: 6px; }
.yyc-chat__body ul { margin: 0; padding-left: 18px; }
.yyc-chat__body li { margin: 2px 0; }
.yyc-chat__body strong { font-weight: 600; }
.yyc-chat__body em { color: var(--c-muted); font-size: 12px; }
.yyc-chat__pill {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600; line-height: 1.6; vertical-align: 1px;
}
.yyc-chat__pill--delayed { background: #FBE9E7; color: var(--c-red); }
.yyc-chat__pill--atrisk  { background: #FDF0E2; color: #8A4100; }
.yyc-chat__pill--ontrack { background: var(--c-blue-soft); color: var(--c-blue); }
.yyc-chat__pill--done    { background: #E3F3EA; color: #1E6B3C; }

/* Clear button in header */
.yyc-chat__clear {
  margin-left: auto; border: 1px solid var(--c-navy-700); background: transparent; color: var(--c-light);
  font: inherit; font-size: 11px; cursor: pointer; padding: 3px 9px; border-radius: 4px;
}
.yyc-chat__clear:hover { color: #fff; background: var(--c-navy-700); }
.yyc-chat__clear + .yyc-chat__close { margin-left: 4px; }

  </style>
</head>

  <div id="workspaceLoading" role="status">
    <div class="workspace-loading-card">
      <strong>Loading your workspace</strong>
      <p>Connecting to your account and loading your role profile.</p>
    </div>
  </div>
  <script>
    window.setTimeout(() => {
      if (document.body.classList.contains("auth-ready")) return;
      const loading = document.getElementById("workspaceLoading");
      if (loading) loading.innerHTML = '<div class="workspace-loading-card"><strong>Workspace is still waiting for Firebase</strong><p>Check that Firestore rules are deployed and this account can read its <code>users/{UID}</code> profile. For an unverified local test account, that profile needs <code>allowUnverifiedTesting: true</code>.</p><p><a href="login.html">Return to sign in</a></p></div>';
    }, 8000);
  </script>
  <script type="module" src="jobs-dashboard.js?v=20261029-7"></script>

  <!-- Embedded YYC Assistant widget -->
  <script>
/*
 * YYC Job Control â€“ chatbot widget (MOCK version, no backend, no Firebase).
 * Optional: window.YYCChat.init({ title: "...", getReply: async (text) => "..." })
 *
 * To connect a real AI later, pass your own getReply(text) that calls a Cloud Function.
 * NEVER put an AI API key in this file.
 */
(function () {
  "use strict";

  const SUGGESTIONS = ["Which jobs are delayed?", "How do I reassign a job?", "What are the job stages?", "Show my workload"];

  // ---- MOCK replies: replace with a real backend call later ----
  const MOCK_RULES = [
    { match: /delay|late|overdue/i, reply: "**3 jobs** are past their target date:\n- ABC Sdn Bhd (Audit) {{delayed}} 5 days late\n- XYZ Bhd (Tax) {{delayed}} 2 days late\n- Lim & Co (Tax) {{atrisk}} 1 day late\n_Mock data_" },
    { match: /reassign|transfer|handover/i, reply: "To reassign a job:\n- Open the job from your **team list**\n- Choose a new preparer\n- Confirm\nOnly managers can do this." },
    { match: /stage|workflow|status/i, reply: "Jobs move through these stages:\n- Preparation\n- Review\n- Amendments\n- Draft to client\n- Client review\n- Submission" },
    { match: /workload|my jobs|assigned/i, reply: "You currently hold **12 jobs**:\n- 7 in Preparation {{ontrack}}\n- 3 in Review {{atrisk}}\n- 2 in Amendments {{delayed}}\n_Mock data_" },
    { match: /thank|thanks|thx|tq/i, reply: "You're welcome! Let me know if you need anything else." },
    { match: /bye|goodbye|see you|cya/i, reply: "Goodbye! Have a great day." },
    { match: /who are you|what can you do|help/i, reply: "I'm the YYC assistant (demo). I can answer questions about:\n- **Delayed jobs**\n- **Reassigning** a job\n- **Job stages**\n- Your **workload**" },
    { match: /hello|hi\b|hey/i, reply: "Hi! I'm the YYC assistant. Ask me about jobs, stages or workload." },
  ];
  const FALLBACK = "I'm only a demo right now, so I can't answer that yet. Try one of the suggestions below the chat.";

  async function defaultGetReply(text) {
    await new Promise((r) => setTimeout(r, 700 + Math.random() * 600)); // fake thinking time
    const rule = MOCK_RULES.find((x) => x.match.test(text));
    return rule ? rule.reply : FALLBACK;
  }

  const ICON_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
  const ICON_BOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M9 13h.01M15 13h.01"/></svg>';

  // ---- Formatting: safe mini-markdown (escape first, then add tags) ----
  const PILLS = { delayed: "Delayed", atrisk: "At risk", ontrack: "On track", done: "Done" };
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return escapeHtml(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`(.+?)`/g, "<code>$1</code>")
      .replace(/(^|\s)_(.+?)_(?=\s|$|[.,!?])/g, "$1<em>$2</em>")
      .replace(/\{\{(delayed|atrisk|ontrack|done)\}\}/g, function (_, k) {
        return '<span class="yyc-chat__pill yyc-chat__pill--' + k + '">' + PILLS[k] + "</span>";
      });
  }
  function formatMessage(text) {
    const out = [];
    let list = null;
    String(text).split("\n").forEach(function (line) {
      const m = line.match(/^\s*[-â€¢]\s+(.*)$/);
      if (m) {
        if (!list) { list = []; }
        list.push("<li>" + inline(m[1]) + "</li>");
      } else {
        if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; }
        if (line.trim() !== "") out.push("<p>" + inline(line) + "</p>");
      }
    });
    if (list) out.push("<ul>" + list.join("") + "</ul>");
    return out.join("");
  }

  // ---- Saved history (browser localStorage; wrapped in try/catch) ----
  const STORE_KEY = "yycChat.history.v1";
  const MAX_SAVED = 60;
  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function (m) { return m && typeof m.text === "string" && (m.who === "user" || m.who === "bot"); }) : [];
    } catch (e) { return []; }
  }
  function saveHistory(arr) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(arr.slice(-MAX_SAVED))); } catch (e) { /* storage unavailable: ignore */ }
  }

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function timeOf(ts) {
    return new Date(ts || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function init(options) {
    if (document.querySelector(".yyc-chat")) return; // already mounted
    const opts = Object.assign({ title: "YYC Assistant", subtitle: "demo mode", getReply: defaultGetReply }, options || {});

    const root = el("div", "yyc-chat");
    const launcher = el("button", "yyc-chat__launcher", ICON_CHAT);
    launcher.type = "button";
    launcher.setAttribute("aria-label", "Open chat assistant");

    const panel = el("section", "yyc-chat__panel");
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", opts.title);

    const header = el("div", "yyc-chat__header");
    const avatar = el("div", "yyc-chat__avatar", ICON_BOT);
    const titles = el("div");
    const title = el("div", "yyc-chat__title"); title.textContent = opts.title;
    const sub = el("div", "yyc-chat__sub"); sub.textContent = opts.subtitle;
    titles.append(title, sub);
    const closeBtn = el("button", "yyc-chat__close", "&times;");
    closeBtn.type = "button"; closeBtn.setAttribute("aria-label", "Close chat");
    const clearBtn = el("button", "yyc-chat__clear", "Clear");
    clearBtn.type = "button"; clearBtn.title = "Clear conversation"; clearBtn.setAttribute("aria-label", "Clear conversation");
    header.append(avatar, titles, clearBtn, closeBtn);

    const messages = el("div", "yyc-chat__messages");
    messages.setAttribute("aria-live", "polite");
    const chips = el("div", "yyc-chat__chips");

    const form = el("form", "yyc-chat__form");
    const input = el("input", "yyc-chat__input");
    input.type = "text"; input.placeholder = "Ask about jobs, stages, workloadâ€¦"; input.autocomplete = "off";
    input.setAttribute("aria-label", "Message");
    const send = el("button", "yyc-chat__send", "Send");
    send.type = "submit";
    form.append(input, send);
    const note = el("div", "yyc-chat__note"); note.textContent = "Demo responses â€“ not real job data.";

    panel.append(header, messages, chips, form, note);
    root.append(panel, launcher);
    document.body.appendChild(root);

    let history = loadHistory();

    function addMessage(text, who, ts, skipSave) {
      ts = ts || Date.now();
      const m = el("div", "yyc-chat__msg yyc-chat__msg--" + who);
      const body = el("div", "yyc-chat__body");
      if (who === "bot") body.innerHTML = formatMessage(text); // formatMessage escapes HTML first
      else body.textContent = text;
      const t = el("div", "yyc-chat__time"); t.textContent = timeOf(ts);
      m.append(body, t);
      messages.appendChild(m);
      messages.scrollTop = messages.scrollHeight;
      if (!skipSave) { history.push({ who: who, text: text, ts: ts }); saveHistory(history); }
      return m;
    }
    function addTyping() {
      const m = el("div", "yyc-chat__msg yyc-chat__msg--bot", '<div class="yyc-chat__typing"><span></span><span></span><span></span></div>');
      messages.appendChild(m);
      messages.scrollTop = messages.scrollHeight;
      return m;
    }

    async function handle(text) {
      text = text.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = ""; send.disabled = true; input.disabled = true;
      const typing = addTyping();
      let reply;
      try { reply = await opts.getReply(text); }
      catch (err) { reply = "Sorry, something went wrong. Please try again."; }
      typing.remove();
      addMessage(reply, "bot");
      send.disabled = false; input.disabled = false; input.focus();
    }

    SUGGESTIONS.forEach((s) => {
      const c = el("button", "yyc-chat__chip"); c.type = "button"; c.textContent = s;
      c.addEventListener("click", () => handle(s));
      chips.appendChild(c);
    });

    function setOpen(open) {
      root.classList.toggle("is-open", open);
      launcher.setAttribute("aria-label", open ? "Close chat assistant" : "Open chat assistant");
      if (open) { messages.scrollTop = messages.scrollHeight; input.focus(); }
    }
    launcher.addEventListener("click", () => setOpen(!root.classList.contains("is-open")));
    closeBtn.addEventListener("click", () => setOpen(false));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
    form.addEventListener("submit", (e) => { e.preventDefault(); handle(input.value); });

    const GREETING = "Hi! I'm the YYC assistant (demo). What would you like to know?";
    if (history.length) history.forEach(function (h) { addMessage(h.text, h.who, h.ts, true); });
    else addMessage(GREETING, "bot");

    clearBtn.addEventListener("click", function () {
      history = []; saveHistory(history);
      messages.innerHTML = "";
      addMessage(GREETING, "bot");
    });
  }

  window.YYCChat = { init: init };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", () => init());
  else init();
})();

  </script>
</body>
